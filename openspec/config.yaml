schema: spec-driven

context: |
  # OPM Core Development Constitution

  ## Core Principles (Canonical Schema)

  This repo defines and publishes the Open Platform Model **core schema** as a versioned CUE
  module (`opmodel.dev/core@v2`). It is the source of truth for OPM: every OPM artifact is typed
  against these definitions, and `library`, `catalog`, `cli`, `opm-operator`, `modules` and the
  deployment repositories all consume it as a published dependency — never by filesystem path.
  This is a pure CUE repository. There is no Go code here.

  ### I. The Schema Is a Published Contract
  A breaking change to the `core` package is a breaking change for every consumer, and consumers
  cannot opt out of a definition they already unify against.
  - Prefer additive evolution. Adding an optional field is cheap; tightening a published
    constraint is not.
  - Tightening an existing constraint is breaking even when no field is removed — consumers that
    validated yesterday may fail today.
  - A change that cannot be additive MUST state its downstream migration cost explicitly, naming
    the consuming repos it breaks.
  - Never run `cue mod publish` against a live registry by hand. CI publishes on release.

  ### II. SPEC.md Co-Update Is Mandatory
  The normative specification is not documentation that trails the schema; it is part of the
  change.
  - **Before editing any `src/*.cue` file, load `.claude/skills/core-schema-edit/SKILL.md`.** It is
    the binding protocol, not background reading.
  - Every change to a construct tracked in `.tasks/spec-tracked.txt` MUST co-commit with its
    `SPEC.md` section update, in the four-part format that skill defines.
  - Three layers enforce this and none of them can be talked around: the local pre-commit hook
    (`task hooks:install`), `task spec:check` (wired into `task check`), and the CI co-update gate
    in `ci.yml`.
  - The `SPEC_IMPACT=none` / `Spec-Impact: none` escape is for genuinely spec-neutral edits —
    whitespace, formatting, doc-comment typos — and requires a stated reason. It is not a way to
    defer the write-up.
  - A new top-level construct that is not a helper MUST be added to `.tasks/spec-tracked.txt` in
    the same commit that introduces it.

  ### III. Type Discipline in CUE
  The schema's job is to make invalid OPM artifacts unrepresentable, as early as possible.
  - Express constraints in the type where CUE can check them, rather than in prose a consumer
    must remember.
  - Prefer a closed definition with an explicit escape over an open one that accepts anything.
  - Derived values SHOULD be computed in the schema rather than authored, so an artifact cannot
    disagree with itself.
  - Every definition carries a doc comment — `task generate:index` extracts it into
    `src/INDEX.md`, so a missing comment degrades the published index.

  ### IV. Single Package, Single Major
  - `src/` is the CUE module root: the `core` package and its `cue.mod/` both live there, so the
    import path is `opmodel.dev/core@v2` with no per-version subdirectory.
  - A breaking schema revision bumps the module major (`@v2` → `@v3`). It does not add a sibling
    package or a versioned subdirectory.
  - `@v2` currently ships `v2.0.0-alpha.N` prereleases. The stable compatibility promise has not
    started, so a break lands in the alpha line with the module path unmoved. Do not treat that as
    permanent licence — say so explicitly in the proposal when a change relies on it.
  - Crossing a major is a deliberate, separately-decided act, not something an alpha break implies.
    It edits `src/cue.mod/module.cue`'s `module:` line and forces the version with a
    `Release-As: X.0.0-alpha.1` footer in the SAME commit — `cue mod publish` rejects a tag whose
    major disagrees with the declared module path, so the two can never land apart. It also costs
    every consumer an import rewrite rather than a dependency bump, which is the difference a
    proposal MUST state.
  - Pin `language: version: "v0.17.0"` in `cue.mod/module.cue`. That is a consumer floor, not a
    toolchain pin: a module declaring `vX` is rejected by every `cue` older than `vX`.

  ### V. Simplicity & YAGNI
  Every published definition is a permanent support obligation.
  - Start with the simplest schema that types a real downstream need.
  - Defer speculative fields, extension points and open structs until a consumer actually requires
    one.
  - A definition that exists so that something *could* be expressed, with nothing expressing it,
    is surface without a consumer — leave it out.

  ### VI. Mergeable Sections (Iterative & Incremental Delivery)
  A change is delivered as the sections of its `tasks.md` (`## N. Title` headings with `N.M`
  checkboxes). Two invariants hold at every section boundary; they replace any size limit on
  the change itself.
  - **Every merge leaves `main` releasable.** A section MUST end green under the validation
    gates and MUST close with a commit task naming the Conventional Commit it lands as
    (§ Commit Conventions below; each schema commit carries its `SPEC.md` section update, Principle II). Nothing that would break `main` is carried across a section boundary.
  - **Work survives a session boundary.** The commit task is the pause point: a session that
    stops there leaves checked boxes and a clean tree, and the next session resumes by running
    apply again.
  - One PR per change, one commit per section, is the default. Section 1 is a spike whenever
    design.md carries an unverified assumption.
  - **WARNING & BLOCK**: when a request cannot be cut into sections that each satisfy both
    invariants, or needs more than about five, the Agent MUST warn, block, and propose a split
    into sequential changes (Execution Gate).

  ## Execution Gate (Agent Directive)
  Before beginning ANY implementation, the Agent MUST evaluate the request against the
  "Mergeable Sections" principle. Block only when the request cannot be cut into sections that
  each end green and leave `main` releasable, or when it needs more than about five such
  sections. In that case the Agent MUST reply with:
  "🛑 **Scope Warning**: This request does not cut into a handful of mergeable sections. I
  suggest we split it into the following changes: [list 2-3 changes, each a few sections that
  leave main releasable]. Should we start with the first?"

  ## Technology Standards

  See [AGENTS.md](../AGENTS.md) for full details. This repo has no `CONSTITUTION.md`; this file and
  `AGENTS.md` are the two normative sources, and `Taskfile.yml` wins over both on how commands run.
  - Language: CUE only. No Go, no other runtime.
  - CUE language floor: `v0.17.0`, declared in `src/cue.mod/module.cue`.
  - Toolchain: pinned separately (CI `CUE_VERSION`, and `cuelang.org/go` in the consuming Go repos).
  - Build/validate entrypoint: `Taskfile.yml`. All raw `cue` invocations run from `src/`.
  - Registry vars (`CUE_REGISTRY`, `OPM_REGISTRY`) come from the workspace root `AGENTS.md`.

  ## Code Style

  ### CUE Patterns
  - Follow the CUE style used across the workspace catalogs.
  - Every top-level definition carries a doc comment; it becomes its `src/INDEX.md` description.
  - Keep constraint names and regexes consistent with their neighbours in `types.cue` — a new
    `*Type` that duplicates an existing one with a slightly different regex is a defect.
  - Do not hard-wrap prose in `.md` files.

  ### Generated Artifacts
  - `src/INDEX.md` is regenerated by `task generate:index`. Review the generated output before
    committing — it extracts doc comments verbatim.
  - The Project Structure tree inside `src/INDEX.md` is hand-maintained alongside the generated
    section. Update both when the tree under `src/` changes.

  ## Commit Conventions (release-please drives releases)
  Releases are driven entirely by commit type. A misclassified commit either cuts a release nobody
  needs or hides a change consumers needed to see.
  - `feat:` (minor) — new construct, new field, additive schema surface.
  - `fix:` (patch) — wrong constraint, broken default, definition behaving wrong.
  - `feat!:` / `BREAKING CHANGE:` (advances `-alpha.N` on `@v2`) — removing or renaming a
    definition, tightening a published constraint.
  - `refactor:`, `docs:`, `style:`, `chore:`, `test:`, `ci:`, `build:` — no release.
  - **Rule of thumb**: if the published CUE schema is byte-identical before and after, it is not a
    `feat:` or a `fix:`.
  - AI attribution: an optional plain `Co-Authored-By: Claude <noreply@anthropic.com>` trailer is
    the only allowed form — never generated-with footers, model-versioned co-author lines, or
    session IDs/URLs in a commit message, PR title, PR body, issue or review comment. See
    `AGENTS.md`.

  ### Comments
  - Default to no enhancement reference: say what the code does and why, in the comment's own words.
  - When the rationale genuinely lives in an enhancement, cite it once at the symbol as `0011:D9` — enhancement id, colon, decision id, no space. One enhancement, several decisions: `0011:D16/D18/D21`. Across enhancements: `0011:D9, 0010:D34`. One requirement of a decision: `0011:D9:R2`; several: `0011:D9:R1/R2`. A bare `D9` names nothing, because decision numbers restart per enhancement.
  - Never cite a section, slice, phase, task or design-doc-local id (`§8.1`, `slice C2`, `task 4.2`, `design LD3`). They are not stable identifiers; a requirement number (`R2`) is.
  - Never put a reference in a scaffold template, a generated file, a fixture a user copies, or a CLI output string. Those reach people with no access to the enhancements repo.
  - No `Was:` rename history in comments; `git log` owns it.
  - In CUE, the reference goes in a `// WHY` block separated from the doc comment by one blank line, never in the doc comment itself: `cue lsp` hover, `Value.Doc()` and `cue def` replay a doc comment verbatim.
  
  ## Validation Gates (before merge)
  1. `task fmt:check` — CUE files are formatted.
  2. `task vet` — the core schema package validates.
  3. `task generate:index:check` — `src/INDEX.md` is up to date.
  4. `task spec:check` — `SPEC.md` inventory matches the tracked CUE constructs.

  Equivalently, `task check` runs all four.

rules:
  proposal:
    - "Focus: WHY we're doing this, WHAT's in/out of scope"
    - "Updates when: Scope changes, intent clarifies, approach fundamentally shifts"
    - Name every downstream consumer the change reaches (`library`, `cli`, `opm-operator`, the
      catalogs, `modules`) and what each of them has to do about it.
    - State whether this is MAJOR/MINOR/PATCH per Principle I, and whether it relies on `@v2`
      still being in prerelease (Principle IV).
    - Breaking changes MUST be called out explicitly with downstream migration cost — a tightened
      constraint counts as breaking even when nothing is removed.
    - Additions to the published surface MUST justify themselves against Principle V.
    - Scope MUST cut into at most about five tasks.md sections, each ending green and leaving
      `main` releasable on its own (Principle VI).
    - "Delivery mode: one PR per change is the default and needs no statement. When a downstream
      consumer must pick up a published pin mid-change, add exactly one line to the proposal,
      `Delivery: one PR per section (<consumer> needs <pin> after section <N>)`, and the change
      ships section by section. In that mode the change stays active on main between PRs, and
      spec sync and enhancement delivery logging wait for archive after the last PR."
    - When the change implements a slice of an enhancement, cite the entry and the decision
      numbers it satisfies (e.g. `enhancements/0010` D1, D6, D8) or, when only part of a decision lands, the requirement numbers (`0010:D4:R1/R2`) rather than restating the design.
    - "If this change implements decisions from an enhancement in the sibling enhancements/ repo, create enhancement.yaml in this change directory declaring it (implements: [{enhancement: \"NNNN\", decisions: [D1, ...], resolves: []}]). Write it at creation time, while the enhancement is in context; it is what makes archive-time delivery logging mechanical."

  design:
    - "Focus: HOW we'll implement it technically"
    - "Updates when: Implementation reveals better approach, constraints change"
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - MUST include a "Research & Decisions" section when exploration was done.
    # Every entry in a rules list MUST be a plain string. OpenSpec 1.3.1 drops
    # the WHOLE artifact's rules with `Rules for 'design' must be an array of
    # strings, ignoring this artifact's rules` if any entry is a mapping — so
    # the familiar `- Format: |` block silently disables every design rule
    # beside it. Keep this one a block scalar, not a `Format:` key.
    - |
      Format for that section:

      ## Research & Decisions

      ### [Topic]
      **Context**: [Why this decision was needed]
      **Explored**: [What was investigated - link to exploration notes]
      **Decision**: [Chosen option]
      **Rationale**: [Why this option was selected]
    - Show the CUE, not a description of the CUE — the definition's shape is the design.
    - Name every `src/*.cue` file the change touches, and every construct in
      `.tasks/spec-tracked.txt` whose SPEC.md section moves with it.
    - State whether any construct is newly tracked (added to `.tasks/spec-tracked.txt`) or is a
      helper deliberately left untracked, and why.
    - Call out any change to a definition's closedness, defaults, or required-field set — these
      break consumers in ways an added optional field does not.

  specs:
    - "Focus: WHAT behavior is changing (not HOW it's implemented)"
    - "Updates when: New or changed requirements emerge"
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - When a requirement implements an enhancement requirement, cite `NNNN:DN:Rn` in its body
      (first sentence or a trailing `Source:` line), never inside the `### Requirement:` header,
      which tools read as the requirement's name.
    - Describe observable behavior — what an artifact may now express, what it may no longer
      express, and what error a consumer sees when it gets it wrong.
    - Use ADDED/MODIFIED/REMOVED sections to show deltas.
    - Include scenarios in both directions — a value the change starts accepting, and a value it
      starts rejecting.
    - Spec deltas here describe schema behavior. They do not replace `SPEC.md`, which is the
      published normative specification and is updated in the implementing commit itself.

  tasks:
    - "Focus: STEPS to take for implementation"
    - "Updates when: Tasks complete, new tasks discovered, blockers identified"
    - "CRITICAL: Every `## N.` section MUST end green under the validation gates and MUST close
      with a commit task: an ordinary `- [ ] N.M` checkbox whose text names the Conventional
      Commit to make, e.g. `- [ ] 1.4 task check green, then commit feat(component): add the skewPolicy field`
      (types per § Commit Conventions). The commit task is the pause point; nothing uncommitted is carried across
      a section boundary."
    - "CRITICAL: Cut the change into at most about seven sections, each a coherent unit that
      leaves main releasable by itself. If it needs more, or a section cannot end green on its
      own, split into a new OpenSpec change. Section 1 is a spike whenever design.md carries an
      unverified assumption; its commit task lands what the spike produced (a test, a fixture,
      or the finding written into design.md)."
    - Group tasks by `src/*.cue` file.
    - Pair every schema task with its `SPEC.md` section task inside the same section — they land
      in that section's commit (Principle II), never scheduled apart.
    - Include `task generate:index` as a task whenever definitions are added, removed or renamed,
      or the tree under `src/` changes.
    - Include the validation gates (`task check`, or the four individually) in every section's commit task, not as a
      trailing section; cross-cutting checks (downstream catalog and consumer builds) go into the last real section before
      its commit.
    - "The section-closing commit is the ONLY delivery operation allowed in tasks.md: no pushing,
      branching, opening or merging PRs, tagging, cutting releases, and no commit-message or
      PR-body hygiene checks. Everything past the commit happens under the repo's normal git
      workflow (one PR per change by default; one PR per section only when the proposal says
      so). Sole exception: a change whose stated deliverable is itself a release or publishing
      operation; there those steps ARE the implementation."

# Operation hooks: served to the agent by `openspec instructions apply|archive --change <name>
# --json` as operationGuidance.
operations:
  apply:
    guidance:
      - "Work section by section: every `## N.` block of tasks.md ends with a commit task. Before
        checking that box, run the section's gates (`task check`) on the whole tree and make
        exactly the named Conventional Commit (types per § Commit Conventions; optional plain Co-Authored-By: Claude
        <noreply@anthropic.com> trailer only, never a session link, never a bare @name, and
        no body line starting with word( because the squash body reaches release-please). The commit must pass the SPEC.md co-commit gate (Principle II): a spec-neutral
        section uses the SPEC_IMPACT=none escape with a stated reason. Do not start the next section with uncommitted work in the tree."
      - "The commit task is the only delivery operation apply performs: no push, no PR, no tag,
        no release. Commit on the working branch the run started on. If the run started on
        main, create the working branch before the first commit task; never commit to main."
      - "Pausing: when the user asks to pause, or a blocker appears, finish the current section's
        commit task first if its gates are green; otherwise report exactly which boxes are
        checked and what is uncommitted in the tree. A new session resumes by running apply
        again: the checked boxes plus a clean tree are the resume state."
      - "Delivery mode: unless proposal.md carries `Delivery: one PR per section`, all section
        commits ship in one PR after the last section and the PR title carries the change's
        release class. In per-section mode each section commit is the PR title and therefore a
        release trigger; the change stays active on main between PRs, and spec sync and enhancement
        delivery logging wait for archive after the last PR."
  archive:
    guidance:
      - "If this change directory contains enhancement.yaml, finish the archive by logging the landing: from the workspace root run `task enhancements:delivery:log FROM=<archived-change-path> SUMMARY=\"<one line: what landed>\"`. It appends a CUE-validated entry to each declared enhancement's delivery.yaml; confirm it printed 'logged' for every declared enhancement."

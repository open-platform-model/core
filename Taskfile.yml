version: "3"

# Silent by default — set TASK_VERBOSE=1 or use --verbose to show commands
silent: true

vars:
  # The OpenSpec CLI that the generated skills under .claude/skills/ come from.
  # The one pin: task openspec:install and the CI step both read it from here.
  OPENSPEC_VERSION: 1.14.1

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  ## CUE schema

  fmt:
    desc: Format all CUE files (the schema under src/ and docs-kit.cue)
    cmds:
      - (cd src && cue fmt ./...)
      - cue fmt docs-kit.cue

  fmt:check:
    desc: Verify CUE files are formatted (fails if any file would change)
    cmds:
      - (cd src && cue fmt ./...)
      - cue fmt docs-kit.cue
      - git diff --exit-code -- 'src/*.cue' docs-kit.cue

  vet:
    desc: Validate the core schema package
    dir: src
    cmds:
      - cue vet ./...
      # cue vet never reports an incomplete hidden pin, so a regression that
      # leaves #Catalog.provides optional or incomplete, or drops the bind of
      # an attachment map key to its member's fqn, would pass silently.
      # Exporting these pins demands concrete values (SPEC §3.1, §3.6).
      - |
        cue export ./pins -e '[
          _pinAttachFillBlueprintFQN,
          _pinAttachFillResourceFQN,
          _pinAttachFillTraitFQN,
          _pinContractFillBlueprintFQN,
          _pinContractFillResourceFQN,
          _pinContractFillTraitFQN,
          _pinInventoryBareProvidedBy,
          _pinInventoryBaseOnlyProvidedBy,
          _pinInventoryCollideOverSubscribedProvidedBy,
          _pinInventoryDefinerAbsentProvidedBy,
          _pinInventoryDefinerDisabledProvidedBy,
          _pinInventoryDisabledProviderProvidedBy,
          _pinInventoryEmptyProvidedBy,
          _pinInventoryOneProviderProvidedBy,
          _pinInventoryOptionalOnlyProvidedBy,
          _pinInventoryTwoMajorsProvidedBy,
          _pinInventoryTwoProvidersProvidedBy,
          _pinParityDisabledProvider,
          _pinParityOneProvider,
          _pinParityResourceProvider,
          _pinParityTwoMajors,
          _pinParityTwoProviders,
          _pinProvidesBare,
          _pinProvidesBase,
          _pinProvidesEpsilon,
          _pinProvidesGamma,
          _pinProvidesK8up,
          _pinProvidesRestic,
          _pinProvidesS3,
          _pinProvidesS3Optional,
          _pinProvidesVelero,
        ]' >/dev/null

  tidy:
    desc: Tidy the CUE module manifest
    dir: src
    cmds:
      - cue mod tidy

  ## Index generation

  generate:index:
    desc: Regenerate src/INDEX.md from the CUE definitions
    cmds:
      - bash .tasks/generate-index.sh "$(pwd)" > src/INDEX.md

  generate:index:check:
    desc: Verify src/INDEX.md matches generated output (exits non-zero if stale)
    cmds:
      - |
        set -euo pipefail
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT
        bash .tasks/generate-index.sh "$(pwd)" > "$tmp"
        if ! diff -q src/INDEX.md "$tmp" >/dev/null 2>&1; then
          echo "FAIL: src/INDEX.md is out of date — run 'task generate:index'"
          diff src/INDEX.md "$tmp" || true
          exit 1
        fi
        echo "OK: src/INDEX.md is up to date."

  ## SPEC.md drift checks

  spec:check:
    desc: Verify SPEC.md inventory matches CUE construct definitions
    cmds:
      - bash .tasks/spec-check.sh "$(pwd)"

  ## Doc comment length

  docs:check:
    desc: Fail on doc comments over 6 lines in src/*.cue
    cmds:
      - bash .tasks/doc-check.sh src --strict

  ## Docs bundle
  #
  # docs-kit.cue declares one docs bundle, core: the definitions reference
  # opm-docs generates from src/ (docs-kit C17), plus the authored pages under
  # docs/site/. CI builds, signs and publishes it through docs-kit's
  # publish.yml (docs.yml, release.yml). These tasks run the same opm-docs
  # release locally. The release is pinned in .opm-docs-version and in every
  # publish.yml ref, and docs:bundle:check refuses the two disagreeing.

  tools:opm-docs:
    desc: Install or reuse .bin/opm-docs, the checksum-verified docs-kit release named by .opm-docs-version
    cmds:
      - bash .tasks/opm-docs.sh install

  docs:bundle:
    desc: Build the core docs bundle of the work tree into out/core/ (a local preview of edge)
    deps: [tools:opm-docs]
    cmds:
      - .bin/opm-docs build --project core --out out

  docs:pins:check:
    desc: Refuse a docs-kit publish.yml ref under .github/workflows/ that names another release than .opm-docs-version (offline)
    cmds:
      - bash .tasks/opm-docs.sh pin-check

  cascade:wiring:check:
    desc: Run the canonical release-cascade wiring check offline (copy of .github's at the pinned SHA)
    cmds:
      - bash .tasks/cascade/wiring-check.sh

  docs:bundle:check:
    desc: Check the docs-kit pins agree, then build and lint the core docs bundle into a temporary directory
    deps: [tools:opm-docs]
    cmds:
      - task: docs:pins:check
      - .bin/opm-docs check --project core

  ## Git hooks

  hooks:install:
    desc: Install git hooks (SPEC.md co-update gate; bare-@mention gate)
    cmds:
      - |
        set -euo pipefail
        for h in pre-commit commit-msg; do
          src="$(pwd)/.tasks/hooks/$h"
          dst=".git/hooks/$h"
          if [[ -e "$dst" && ! -L "$dst" ]]; then
            echo "ERROR: $dst exists and is not a symlink." >&2
            echo "Backup or remove it before installing." >&2
            exit 1
          fi
          chmod +x "$src"
          ln -sf "$src" "$dst"
          echo "Installed: $dst -> $src"
        done

  hooks:uninstall:
    desc: Remove installed git hooks (symlinks only)
    cmds:
      - |
        set -euo pipefail
        for h in pre-commit commit-msg; do
          dst=".git/hooks/$h"
          if [[ -L "$dst" ]]; then
            rm -f "$dst"
            echo "Removed: $dst"
          fi
        done

  ## Publishing

  publish:
    desc: Publish the CUE module at VERSION to the local registry only (task publish VERSION=vX.Y.Z; CI publishes releases)
    requires:
      vars: [VERSION]
    cmds:
      - |
        set -euo pipefail
        # Forced here, whatever the shell exports: a release is published only
        # by CI, so a laptop publish must never reach GHCR. Exported in the
        # script because an exported CUE_REGISTRY beats a task-level env:.
        export CUE_REGISTRY="opmodel.dev=localhost:5000+insecure,registry.cue.works"
        (cd src && cue fmt ./...)
        git diff --exit-code -- 'src/*.cue'
        (cd src && cue vet ./...)
        (cd src && cue mod publish "{{.VERSION}}")

  branch-tag:
    desc: Print the branch-publish tag for HEAD (no side effects)
    cmds:
      - bash .tasks/branch-tag.sh "$(pwd)"

  publish:branch:
    desc: Publish HEAD as a -dev pre-release derived from the commit
    cmds:
      - task: check:base
      - |
        set -euo pipefail
        tag=$(bash .tasks/branch-tag.sh "$(pwd)")
        echo "Publishing opmodel.dev/core@${tag}"
        (cd src && cue mod publish "${tag}")

  ## Comment rule

  # The tool commit equals the enh-ref default of cite-lint.yml in the pinned
  # .github; move both together. No excludes: the tool skips .git, vendor,
  # agent-swarm/, .claude/, CHANGELOG.md and the CUE caches itself. Add an
  # exclude here and to the cite-lint job of .github/workflows/ci.yml, with
  # the reason beside each.
  cite-lint:
    desc: Fail on a decision number or a lone enhancement id in a CUE comment (needs Go; same tool commit as CI)
    cmds:
      - go run github.com/open-platform-model/enhancements/tools/enh@e0335b2ec44e659c0191bc3523d79d17f26f8e7d cite-lint --root .

  ## OpenSpec

  openspec:install:
    desc: Install the openspec CLI at OPENSPEC_VERSION (needs npm; install scripts do not run)
    cmds:
      - npm install -g --ignore-scripts @fission-ai/openspec@{{.OPENSPEC_VERSION}}

  openspec:check:
    desc: Validate every main spec and change with the pinned openspec in strict mode (the long-requirement limit is a warning, and strict fails on it)
    env:
      OPENSPEC_TELEMETRY: "0"
    preconditions:
      - sh: command -v openspec >/dev/null
        msg: "openspec not found: run `task openspec:install` (needs npm)"
      - sh: test "$(openspec --version)" = "{{.OPENSPEC_VERSION}}"
        msg: "openspec is not {{.OPENSPEC_VERSION}}: run `task openspec:install`"
    cmds:
      - openspec validate --all --strict --no-interactive

  ## Aggregate

  # check:base is every gate of check except openspec:check. publish:branch
  # calls it: that job holds a token that can write packages, and the openspec
  # CLI is npm code that no lockfile pins, so it must not run there. The
  # required ci.yml job runs the full check, openspec included.
  check:base:
    desc: Every gate of check except the openspec check (the branch-publish job runs this one)
    cmds:
      - task: fmt:check
      - task: vet
      - task: generate:index:check
      - task: spec:check
      - task: docs:check
      - task: docs:bundle:check
      - task: cascade:wiring:check

  check:
    desc: Format check, vet, INDEX freshness, SPEC inventory, doc-comment report, definitions reference freshness, the docs bundle check, the cascade wiring check, and the openspec check
    cmds:
      - task: check:base
      - task: openspec:check

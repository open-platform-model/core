version: "3"

# Silent by default — set TASK_VERBOSE=1 or use --verbose to show commands
silent: true

vars:
  CUE_VERSION: v0.16.0

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  ## CUE schema

  fmt:
    desc: Format all CUE files
    cmds:
      - cue fmt ./...

  fmt:check:
    desc: Verify CUE files are formatted (fails if any file would change)
    cmds:
      - cue fmt ./...
      - git diff --exit-code -- '*.cue'

  vet:
    desc: Validate the v1alpha2 schema package
    cmds:
      - cue vet ./...

  tidy:
    desc: Tidy the CUE module manifest
    cmds:
      - cue mod tidy

  ## Index generation

  generate:index:
    desc: Regenerate INDEX.md from the CUE definitions
    cmds:
      - bash .tasks/generate-index.sh "$(pwd)" > INDEX.md

  generate:index:check:
    desc: Verify INDEX.md matches generated output (exits non-zero if stale)
    cmds:
      - |
        set -euo pipefail
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT
        bash .tasks/generate-index.sh "$(pwd)" > "$tmp"
        if ! diff -q INDEX.md "$tmp" >/dev/null 2>&1; then
          echo "FAIL: INDEX.md is out of date — run 'task generate:index'"
          diff INDEX.md "$tmp" || true
          exit 1
        fi
        echo "OK: INDEX.md is up to date."

  ## SPEC.md drift checks

  spec:check:
    desc: Verify SPEC.md inventory matches CUE construct definitions
    cmds:
      - bash .tasks/spec-check.sh "$(pwd)"

  ## Git hooks

  hooks:install:
    desc: Install git hooks (pre-commit gate for SPEC.md co-updates)
    cmds:
      - |
        set -euo pipefail
        src="$(pwd)/.tasks/hooks/pre-commit"
        dst=".git/hooks/pre-commit"
        if [[ -e "$dst" && ! -L "$dst" ]]; then
          echo "ERROR: $dst exists and is not a symlink." >&2
          echo "Backup or remove it before installing." >&2
          exit 1
        fi
        chmod +x "$src"
        ln -sf "$src" "$dst"
        echo "Installed: $dst -> $src"

  hooks:uninstall:
    desc: Remove installed git hooks (symlinks only)
    cmds:
      - |
        set -euo pipefail
        for h in pre-commit; do
          dst=".git/hooks/$h"
          if [[ -L "$dst" ]]; then
            rm -f "$dst"
            echo "Removed: $dst"
          fi
        done

  ## Publishing

  publish:
    desc: Publish the CUE module at VERSION (e.g. task publish VERSION=v0.1.0)
    requires:
      vars: [VERSION]
    cmds:
      - cue fmt ./...
      - git diff --exit-code -- '*.cue'
      - cue vet ./...
      - cue mod publish {{.VERSION}}

  ## Aggregate

  check:
    desc: Format check, vet, INDEX freshness, and SPEC inventory
    cmds:
      - task: fmt:check
      - task: vet
      - task: generate:index:check
      - task: spec:check

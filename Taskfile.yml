version: "3"

# Silent by default — set TASK_VERBOSE=1 or use --verbose to show commands
silent: true

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  ## CUE schema

  fmt:
    desc: Format all CUE files (the schema under src/ and docs-kit.cue)
    cmds:
      - (cd src && cue fmt ./...)
      - cue fmt docs-kit.cue

  fmt:check:
    desc: Verify CUE files are formatted (fails if any file would change)
    cmds:
      - (cd src && cue fmt ./...)
      - cue fmt docs-kit.cue
      - git diff --exit-code -- 'src/*.cue' docs-kit.cue

  vet:
    desc: Validate the core schema package
    dir: src
    cmds:
      - cue vet ./...

  tidy:
    desc: Tidy the CUE module manifest
    dir: src
    cmds:
      - cue mod tidy

  ## Index generation

  generate:index:
    desc: Regenerate src/INDEX.md from the CUE definitions
    cmds:
      - bash .tasks/generate-index.sh "$(pwd)" > src/INDEX.md

  generate:index:check:
    desc: Verify src/INDEX.md matches generated output (exits non-zero if stale)
    cmds:
      - |
        set -euo pipefail
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT
        bash .tasks/generate-index.sh "$(pwd)" > "$tmp"
        if ! diff -q src/INDEX.md "$tmp" >/dev/null 2>&1; then
          echo "FAIL: src/INDEX.md is out of date — run 'task generate:index'"
          diff src/INDEX.md "$tmp" || true
          exit 1
        fi
        echo "OK: src/INDEX.md is up to date."

  ## SPEC.md drift checks

  spec:check:
    desc: Verify SPEC.md inventory matches CUE construct definitions
    cmds:
      - bash .tasks/spec-check.sh "$(pwd)"

  ## Doc comment length

  docs:check:
    desc: Fail on doc comments over 6 lines in src/*.cue
    cmds:
      - bash .tasks/doc-check.sh src --strict

  ## Docs bundle
  #
  # docs-kit.cue declares one docs bundle, core: the definitions reference
  # opm-docs generates from src/ (docs-kit C17), plus the authored pages under
  # docs/site/. CI builds, signs and publishes it through docs-kit's
  # publish.yml (docs.yml, release.yml). These tasks run the same opm-docs
  # release locally. The release is pinned in .opm-docs-version and in every
  # publish.yml ref, and docs:bundle:check refuses the two disagreeing.

  tools:opm-docs:
    desc: Install or reuse .bin/opm-docs, the checksum-verified docs-kit release named by .opm-docs-version
    cmds:
      - bash .tasks/opm-docs.sh install

  docs:bundle:
    desc: Build the core docs bundle of the work tree into out/core/ (a local preview of edge)
    deps: [tools:opm-docs]
    cmds:
      - .bin/opm-docs build --project core --out out

  docs:pins:check:
    desc: Refuse a docs-kit publish.yml ref under .github/workflows/ that names another release than .opm-docs-version (offline)
    cmds:
      - bash .tasks/opm-docs.sh pin-check

  cascade:wiring:check:
    desc: Check the release-cascade caller workflows (Phase 3 wiring contract 10.1)
    cmds:
      - bash .tasks/cascade/wiring-check.sh

  docs:bundle:check:
    desc: Check the docs-kit pins agree, then build and lint the core docs bundle into a temporary directory
    deps: [tools:opm-docs]
    cmds:
      - task: docs:pins:check
      - .bin/opm-docs check --project core

  ## Git hooks

  hooks:install:
    desc: Install git hooks (SPEC.md co-update gate; bare-@mention gate)
    cmds:
      - |
        set -euo pipefail
        for h in pre-commit commit-msg; do
          src="$(pwd)/.tasks/hooks/$h"
          dst=".git/hooks/$h"
          if [[ -e "$dst" && ! -L "$dst" ]]; then
            echo "ERROR: $dst exists and is not a symlink." >&2
            echo "Backup or remove it before installing." >&2
            exit 1
          fi
          chmod +x "$src"
          ln -sf "$src" "$dst"
          echo "Installed: $dst -> $src"
        done

  hooks:uninstall:
    desc: Remove installed git hooks (symlinks only)
    cmds:
      - |
        set -euo pipefail
        for h in pre-commit commit-msg; do
          dst=".git/hooks/$h"
          if [[ -L "$dst" ]]; then
            rm -f "$dst"
            echo "Removed: $dst"
          fi
        done

  ## Publishing

  publish:
    desc: Publish the CUE module at VERSION to the local registry only (task publish VERSION=vX.Y.Z; CI publishes releases)
    requires:
      vars: [VERSION]
    cmds:
      - |
        set -euo pipefail
        # Forced here, whatever the shell exports: a release is published only
        # by CI, so a laptop publish must never reach GHCR. Exported in the
        # script because an exported CUE_REGISTRY beats a task-level env:.
        export CUE_REGISTRY="opmodel.dev=localhost:5000+insecure,registry.cue.works"
        (cd src && cue fmt ./...)
        git diff --exit-code -- 'src/*.cue'
        (cd src && cue vet ./...)
        (cd src && cue mod publish "{{.VERSION}}")

  branch-tag:
    desc: Print the branch-publish tag for HEAD (no side effects)
    cmds:
      - bash .tasks/branch-tag.sh "$(pwd)"

  publish:branch:
    desc: Publish HEAD as a -dev pre-release derived from the commit
    cmds:
      - task: check
      - |
        set -euo pipefail
        tag=$(bash .tasks/branch-tag.sh "$(pwd)")
        echo "Publishing opmodel.dev/core@${tag}"
        (cd src && cue mod publish "${tag}")

  ## Aggregate

  check:
    desc: Format check, vet, INDEX freshness, SPEC inventory, doc-comment report, definitions reference freshness, the docs bundle check, and the cascade wiring check
    cmds:
      - task: fmt:check
      - task: vet
      - task: generate:index:check
      - task: spec:check
      - task: docs:check
      - task: docs:bundle:check
      - task: cascade:wiring:check

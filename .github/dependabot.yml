version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after an action release before proposing it, so a
    # compromised release has time to be found and pulled first.
    cooldown:
      default-days: 7
    ignore:
      # docs-kit's publish.yml is pinned by release tag and moves together
      # with .opm-docs-version in one PR (docs-kit C5, C12; task
      # docs:pins:check); a Dependabot bump would move one pin alone.
      - dependency-name: "open-platform-model/docs-kit*"
      # The cascade action moves only through a ci(deps) pin PR, one .github
      # SHA per repo (Phase 3 wiring contract 2.4; .github README "Pinning
      # and bumps"); a Dependabot bump would move one reference alone.
      - dependency-name: "open-platform-model/.github*"
    commit-message:
      prefix: "ci"

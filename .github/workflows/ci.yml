name: CI

on:
  push:
    branches: [v1]
  pull_request:

jobs:
  ci:
    name: Validate schema
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The SPEC.md co-update gate diffs origin/<base>...HEAD (triple-dot),
          # which needs the merge base in the local repo. Default fetch-depth: 1
          # leaves both refs as single isolated commits and the diff exits 128.
          fetch-depth: 0

      - name: Setup CUE
        uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
        with:
          version: v0.17.1

      - name: Install Task
        uses: go-task/setup-task@3be4020d41929789a01026e0e427a4321ce0ad44 # v2.0.0
        with:
          version: 3.x

      # The schema imports only the CUE standard library, so vet runs fully
      # offline — no registry service needed.
      - name: Check CUE formatting
        run: task fmt:check

      - name: Vet CUE schema
        run: task vet

      - name: Verify src/INDEX.md is up to date
        run: task generate:index:check

      - name: Verify SPEC.md inventory matches CUE
        run: task spec:check

      - name: Enforce SPEC.md co-update with *.cue changes
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # No --depth here: checkout already pulled full history (fetch-depth: 0),
          # and --depth=1 would re-shallow the repo and break the triple-dot diff.
          git fetch origin "$BASE_REF"
          files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          cue_changed=$(printf '%s\n' "$files" | grep -E '\.cue$' || true)
          spec_changed=$(printf '%s\n' "$files" | grep -Fx 'SPEC.md' || true)
          if [[ -z "$cue_changed" || -n "$spec_changed" ]]; then
            echo "OK: spec co-update check satisfied."
            exit 0
          fi
          if [[ "${PR_BODY:-}" == *"Spec-Impact: none"* ]]; then
            echo "OK: 'Spec-Impact: none' override present in PR body."
            exit 0
          fi
          echo "ERROR: PR changes *.cue files without updating SPEC.md."
          echo "Changed CUE files:"
          printf '%s\n' "$cue_changed" | sed 's/^/  /'
          echo
          echo "Either: update SPEC.md and include it in this PR."
          echo "Or:     add 'Spec-Impact: none' to the PR body with justification."
          exit 1

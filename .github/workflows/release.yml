name: Release

on:
  push:
    branches:
      - main

# Each job grants exactly what its steps use; a job added without its own
# block gets nothing.
permissions: {}

env:
  CUE_VERSION: 'v0.17.1'
  # opmodel.dev modules publish to GHCR; everything else from registry.cue.works.
  CUE_REGISTRY: 'opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # The only reader of the release App key. The release Environment admits
    # main only, so no branch run can read it.
    environment: release
    # release-please acts with the App token; GITHUB_TOKEN only dispatches CI.
    permissions:
      actions: write
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # A PR opened or pushed with GITHUB_TOKEN holds its CI runs for manual
      # approval. Acting as the release App lets the release PR's CI start on
      # its own.
      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A PR created with GITHUB_TOKEN never triggers pull_request workflows,
      # so the required CI check would sit pending forever on the protected
      # main branch. workflow_dispatch events are exempt from that suppression
      # — dispatch CI onto the release branch so the check run lands on the PR
      # head SHA. Runs on every push to main so an updated release PR is
      # re-checked too; if no release branch exists there is nothing to do.
      - name: Trigger required CI on the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml \
            --repo "${{ github.repository }}" \
            --ref "release-please--branches--main--components--core" \
            || echo "no open release branch - nothing to trigger"

  publish-cue:
    name: Publish opmodel.dev/core
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Publishing runs here, in the same workflow run that the release-PR
      # merge triggers — NOT from a push:tags trigger. A tag pushed by
      # release-please uses GITHUB_TOKEN, and GitHub suppresses workflow runs
      # for GITHUB_TOKEN-pushed tags, so a tag trigger would never fire.
      - name: Clone the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # A published version always names the bytes first pushed under it, and
      # `cue mod publish` overwrites without asking. Exit 1 (already published):
      # release the next version. Exit 2 (registry state unknown): nothing was
      # pushed, re-run the job.
      - name: Refuse a version the registry already holds
        env:
          VERSION: v${{ needs.release-please.outputs.version }}
        run: bash .tasks/publish-probe.sh "${VERSION}"

      - name: Setup CUE
        uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
        with:
          version: ${{ env.CUE_VERSION }}

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish CUE module
        working-directory: src
        run: |
          set -euo pipefail
          # version output is X.Y.Z or X.Y.Z-<type>.N, e.g. 2.0.0-beta.1 (no leading v).
          VERSION="v${{ needs.release-please.outputs.version }}"
          echo "Publishing opmodel.dev/core@v2 at ${VERSION}"
          cue vet ./...
          cue mod publish "${VERSION}"
          echo "Published opmodel.dev/core ${VERSION}"

  # The core docs bundle of the release (docs-kit.cue, core), built from the
  # released tag and published as <version>.0 by docs-kit's publish.yml
  # (docs-kit docs/contracts.md C5). It runs here, in the run the release-PR
  # merge starts, because publish.yml publishes only from refs/heads/main: a
  # `release: published` trigger would run on the tag ref and be refused.
  # needs publish-cue with the default success() gate: a failed or skipped
  # module publish skips it, so the reference never describes a version GHCR
  # does not serve. When this job does not run, docs.yml's dispatch
  # (mode release) publishes the release instead. No version is passed:
  # opm-docs reads it from the tag.
  # This job grants what publish.yml's release mode needs and nothing more.
  publish-docs:
    name: Publish the core docs bundle
    needs: [release-please, publish-cue]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    # Pinned by docs-kit release tag, not a SHA: the signing certificate names
    # publish.yml at this ref, and the site trusts only docs-kit's v* tags
    # (docs-kit C5, C9). Moves with .opm-docs-version in one PR.
    uses: open-platform-model/docs-kit/.github/workflows/publish.yml@v0.4.0
    with:
      project: core
      mode: release
      tag: ${{ needs.release-please.outputs.tag_name }}

  # Caller-owned: declares `environment: cascade` and passes the App key to the
  # pinned cascade-notify action as an input.
  notify-downstream:
    name: Notify downstream
    needs: [release-please, publish-cue]
    if: needs.release-please.outputs.release_created == 'true' && vars.CASCADE_NOTIFY != 'off'
    runs-on: ubuntu-latest
    environment: cascade
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Notify downstream
        uses: open-platform-model/.github/.github/actions/cascade-notify@2376ffae4bfc665f327d51581350dea694c01504 # .github main
        with:
          tag: ${{ needs.release-please.outputs.tag_name }}
          client-id: ${{ vars.CASCADE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CASCADE_APP_PRIVATE_KEY }}

name: Publish CUE Module (manual)

# Manual escape hatch for publishing the CUE module — normal releases publish
# automatically from release.yml. Use this to re-publish a version, or to
# publish a tag that release.yml did not (e.g. a release cut before this
# wiring existed).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag) to check out, e.g. v0.1.0'
        required: true
        type: string
      version:
        description: 'CUE module version to publish, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  CUE_VERSION: 'v0.16.0'
  CUE_REGISTRY: 'opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'

jobs:
  publish:
    name: Publish opmodel.dev/core
    runs-on: ubuntu-latest
    steps:
      - name: Clone the requested ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Setup CUE
        uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
        with:
          version: ${{ env.CUE_VERSION }}

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish CUE module
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          echo "Publishing opmodel.dev/core@v0 at ${VERSION} (from ref ${{ inputs.ref }})"
          cue vet ./...
          cue mod publish "${VERSION}"
          echo "Published opmodel.dev/core ${VERSION}"

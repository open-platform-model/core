name: Publish CUE Module

# Publishes the CUE module on the vX.Y.Z tags produced by release-please
# (release.yml). A workflow_dispatch path is kept for manual re-publishing —
# e.g. a tag that predates this wiring.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag) to check out, e.g. v0.1.0'
        required: true
        type: string
      version:
        description: 'CUE module version to publish, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  CUE_VERSION: 'v0.16.0'
  # opmodel.dev modules publish to GHCR; everything else from registry.cue.works.
  CUE_REGISTRY: 'opmodel.dev=ghcr.io/open-platform-model,registry.cue.works'

jobs:
  publish:
    name: Publish opmodel.dev/core
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref and version
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Tag push: the tag name is both the ref and the publish version.
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone the requested ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.resolve.outputs.ref }}

      - name: Setup CUE
        uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
        with:
          version: ${{ env.CUE_VERSION }}

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish CUE module
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve.outputs.version }}"
          echo "Publishing opmodel.dev/core@v0 at ${VERSION}"
          cue vet ./...
          cue mod publish "${VERSION}"
          echo "Published opmodel.dev/core ${VERSION}"
